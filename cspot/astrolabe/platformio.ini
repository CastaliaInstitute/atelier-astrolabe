; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
default_envs = astrolabe-cspot-s3-185-v2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
framework =
  espidf
  arduino
board = esp32-s3-devkitc1-n16r8
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram = opi
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
upload_speed = 921600
extra_scripts = pre:../../extra_script_filter_gfx.py
lib_deps = 
	moononournation/GFX Library for Arduino@1.5.0
	bitbank2/JPEGDEC@1.7.0
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DASTROLABE_WAVESHARE_S3_185=1
	-DASTROLABE_CSPOT_DEVICE_NAME='"Astrolabe 1.85"'

[env:astrolabe-cspot-s3-185-v1]
build_flags = 
	${env.build_flags}
	-DASTROLABE_WAVESHARE_S3_185_V1=1

[env:astrolabe-cspot-s3-185-v2]
build_flags = 
	${env.build_flags}
	-DASTROLABE_WAVESHARE_S3_185_V2=1
