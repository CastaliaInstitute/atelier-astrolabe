[platformio]
src_dir = src
default_envs = esp32_c3_lcd_probe

[env:esp32_c3_lcd_probe]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
upload_port = /dev/cu.usbmodem13401
monitor_port = /dev/cu.usbmodem13401
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	moononournation/GFX Library for Arduino@1.5.0
