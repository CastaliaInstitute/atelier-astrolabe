<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrolabe · Chart Time</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080b12;color:#e6edf5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#1d2840,#080b12 68%)}main{display:grid;gap:16px;justify-items:center;padding:22px}.kicker{margin:0;color:#8ca4c2;font-size:11px;letter-spacing:.18em}.title{margin:4px 0 0;font:22px Georgia,serif;letter-spacing:.03em}.status{color:#9fb6ca;font-size:11px;text-align:center;min-height:16px}.watch{position:relative;width:min(466px,calc(100vw - 34px));height:min(466px,calc(100vw - 34px));border:8px solid #8aa7c4;border-radius:50%;background:repeating-radial-gradient(circle,#07101c 0 28px,#607895 29px 32px,#07101c 33px 58px);box-shadow:0 0 0 9px #202b3a,0 18px 60px #0008;overflow:hidden}.dial-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.watch svg{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;opacity:0}.fallback-dial{position:absolute;inset:0;display:grid;place-items:center;color:#7d9bb9;font-size:390px;line-height:1;opacity:.4;pointer-events:none}.css-dial{position:absolute;inset:0;pointer-events:none}.css-ring{position:absolute;inset:50% auto auto 50%;border:6px solid #6f8eae;border-radius:50%;transform:translate(-50%,-50%);background:transparent}.css-ring:nth-child(1){width:92%;height:92%;border-color:#b0cbed}.css-ring:nth-child(2){width:82%;height:82%;border-color:#8fb0d0}.css-ring:nth-child(3){width:71%;height:71%;border-color:#7191b0}.css-ring:nth-child(4){width:60%;height:60%;border-color:#90a9c1}.css-ring:nth-child(5){width:49%;height:49%;border-color:#7896b4}.css-ring.selected{border:8px solid #f3d27b;box-shadow:0 0 18px #e8b957}.css-hand{position:absolute;left:50%;top:50%;width:5px;height:43%;background:#e9f2fa;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(22deg);box-shadow:0 0 8px #c9e7ff}.css-hub{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;background:#dcecff;transform:translate(-50%,-50%);box-shadow:0 0 14px #9cc9f7}.ring{fill:none;stroke:#607895;stroke-width:2.5}.ring.selected{stroke:#f3d27b;stroke-width:6;filter:drop-shadow(0 0 5px #e8b957)}.tick{stroke:#8ba6c2;stroke-width:2}.month{fill:#c1d2e3;font-size:11px;text-anchor:middle;dominant-baseline:middle}.planet{stroke:#b8d9f5;stroke-width:3;opacity:.95}.planet.sun{stroke:#ffd064}.planet.mars{stroke:#ef7f72}.center{fill:#071321;stroke:#8aa7c4;stroke-width:2}.centerText{fill:#e8eef5;font-size:12px;text-anchor:middle}.hint{color:#7189a3;font-size:11px;text-align:center;max-width:420px;line-height:1.45}.legend{display:flex;gap:15px;color:#9fb6ca;font-size:10px}.legend b{color:#f3d27b}.buttons{display:flex;gap:8px}.buttons button{border:1px solid #40546a;border-radius:7px;background:#142031;color:#dce8f4;padding:8px 12px;font:inherit;cursor:pointer}
</style></head><body><main id="chart-time"><div><p class="kicker">ASTROLABE · CHART TIME</p><h1 class="title" data-chart-title></h1></div>
<div class="watch"><img class="dial-image" src="chart-dial.svg" alt="Concentric editable planetary position rings"><div class="fallback-dial" aria-hidden="true">◎</div><div class="css-dial"><div class="css-ring" data-visual-ring></div><div class="css-ring" data-visual-ring></div><div class="css-ring" data-visual-ring></div><div class="css-ring" data-visual-ring></div><div class="css-ring" data-visual-ring></div><div class="css-hand"></div><div class="css-hub"></div></div><svg viewBox="0 0 466 466" aria-label="Editable planetary chart time face"><g transform="translate(233 235)"><circle class="ring" data-ring r="214"/><circle class="ring" data-ring r="190"/><circle class="ring" data-ring r="166"/><circle class="ring" data-ring r="142"/><circle class="ring" data-ring r="118"/>
<g id="months"></g><g id="planets"><line class="planet sun" x1="0" y1="0" x2="0" y2="-92"/><line class="planet" x1="0" y1="0" x2="66" y2="-56"/><line class="planet mars" x1="0" y1="0" x2="-48" y2="-62"/></g><circle class="center" cx="0" cy="0" r="70"/><text class="centerText" x="0" y="-8">PLANETARY</text><text class="centerText" x="0" y="11">POSITIONS</text><text class="centerText" x="0" y="31" fill="#91b8d7">UTC</text></g></svg></div>
<div class="status" data-chart-status></div><div class="legend"><span><b>YEAR</b> outer</span><span><b>MONTH</b></span><span><b>DAY</b></span><span><b>HOUR</b></span><span><b>MIN</b> inner</span></div><p class="hint">Long press, then swipe vertically while holding to select a ring. Release, then swipe to adjust that field. Tap to accept.</p><div class="buttons"><button data-demo="select">Demo select</button><button data-demo="adjust">Demo adjust</button></div></main><script src="chart-time-sim.js"></script><script>
const editor=AstrolabeChartTimeSim.createEditor(Date.UTC(2026,7,1,12,0)); const root=document.querySelector('#chart-time'); const months=document.querySelector('#months'); const names=AstrolabeChartTimeSim.MONTHS; names.forEach((m,i)=>{const a=(i/12)*Math.PI*2-Math.PI/2,x=Math.cos(a)*199,y=Math.sin(a)*199;months.insertAdjacentHTML('beforeend',`<line class="tick" x1="${Math.cos(a)*190}" y1="${Math.sin(a)*190}" x2="${Math.cos(a)*214}" y2="${Math.sin(a)*214}"/><text class="month" x="${x}" y="${y}">${m}</text>`)}); AstrolabeChartTimeSim.attach(root,editor); document.querySelector('[data-demo="select"]').onclick=()=>{editor.state.editing=true;editor.select(1);root.querySelector('[data-chart-status]').textContent='EDIT '+editor.fields[editor.state.selected].toUpperCase()+' · release to set';root.querySelectorAll('[data-ring]').forEach((r,i)=>r.classList.toggle('selected',i===editor.state.selected));}; document.querySelector('[data-demo="adjust"]').onclick=()=>{editor.adjust(1);root.querySelector('[data-chart-title]').textContent=editor.label();};
</script></body></html>
