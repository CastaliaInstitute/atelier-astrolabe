<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Astrolabe Device Face Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111418;
        color: #eef3f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #202833 0, #111418 58%, #090b0f 100%);
      }

      main {
        width: min(100vw, 760px);
        padding: 24px;
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .watch {
        position: relative;
        width: min(466px, calc(100vw - 32px));
        aspect-ratio: 1;
        border-radius: 50%;
        background: #050608;
        box-shadow: 0 0 0 10px #1b222b, 0 24px 80px rgb(0 0 0 / 55%);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .controls {
        width: min(466px, calc(100vw - 32px));
        display: grid;
        grid-template-columns: 38px 1fr 38px;
        align-items: center;
        gap: 8px;
      }

      button,
      select,
      textarea {
        min-height: 38px;
        border: 1px solid #384655;
        border-radius: 7px;
        background: #1b232c;
        color: #eef3f6;
        font: inherit;
        cursor: pointer;
      }

      select {
        width: 100%;
        padding: 0 10px;
      }

      button {
        display: grid;
        place-items: center;
        padding: 0;
      }

      button:hover,
      select:hover {
        background: #24303b;
      }

      button:disabled,
      select:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .settings {
        width: min(466px, calc(100vw - 32px));
        display: grid;
        gap: 8px;
        color: #c6d1dc;
      }

      .voice {
        width: min(466px, calc(100vw - 32px));
        display: grid;
        gap: 8px;
      }

      .voice-meta {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
      }

      .voice-meta label {
        display: inline-grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 7px;
        min-height: 38px;
        color: #c6d1dc;
        font-size: 13px;
      }

      .settings-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .settings input,
      .voice input,
      .voice textarea {
        min-height: 38px;
        width: 100%;
        border: 1px solid #384655;
        border-radius: 7px;
        background: #111923;
        color: #eef3f6;
        padding: 0 10px;
        font: inherit;
      }

      .voice textarea {
        min-height: 72px;
        padding: 10px;
        resize: vertical;
      }

      .voice-report {
        min-height: 64px;
        max-height: 132px;
        overflow: auto;
        margin: 0;
        border: 1px solid #384655;
        border-radius: 7px;
        background: #0b1118;
        color: #adc2d5;
        padding: 8px 10px;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      .voice-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .status {
        min-height: 20px;
        font-size: 13px;
        color: #91a7bc;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="watch">
        <canvas id="astrolabe-canvas" width="466" height="466"></canvas>
      </div>
      <div class="controls" aria-label="Watch face controls">
        <button type="button" id="prev-face" aria-label="Previous face" disabled>‹</button>
        <select id="face-select" aria-label="Face" disabled></select>
        <button type="button" id="next-face" aria-label="Next face" disabled>›</button>
      </div>
      <section class="voice" aria-label="Voice test controls">
        <div class="voice-meta">
          <select id="voice-provider" aria-label="Voice provider">
            <option value="browser">Browser STT/TTS</option>
            <option value="manual">Manual transcript + Browser TTS</option>
          </select>
          <label><input id="voice-continuous" type="checkbox" /> Continuous</label>
        </div>
        <textarea id="voice-prompt" autocomplete="off" spellcheck="true">What does this face want to say?</textarea>
        <div class="voice-row">
          <button type="button" id="voice-listen">STT</button>
          <button type="button" id="voice-speak">TTS</button>
          <button type="button" id="voice-duplex">Duplex</button>
          <button type="button" id="voice-stop">Stop</button>
        </div>
        <div class="voice-row">
          <button type="button" id="voice-button">Boot/TTS</button>
          <button type="button" id="voice-all">All Faces</button>
          <button type="button" id="voice-clear">Clear</button>
          <button type="button" id="voice-repeat">Repeat</button>
        </div>
        <pre id="voice-report" class="voice-report" aria-live="polite"></pre>
      </section>
      <section class="settings" aria-label="Device settings">
        <input id="device-url" inputmode="url" placeholder="http://astrolabe-e30644.local" autocomplete="off" />
        <div class="settings-row">
          <button type="button" id="sync-wifi">Sync via Wi-Fi</button>
          <button type="button" id="sync-ble">Sync via BLE</button>
        </div>
        <div class="settings-row">
          <input id="wifi-ssid" maxlength="32" placeholder="Wi-Fi SSID or phone hotspot" autocomplete="off" />
          <input id="wifi-pass" maxlength="64" placeholder="Wi-Fi password" type="password" autocomplete="current-password" />
        </div>
        <button type="button" id="send-wifi">Send Wi-Fi Credentials</button>
        <div class="status" id="device-status"></div>
      </section>
    </main>

    <script>
      const controls = {
        prev: document.querySelector("#prev-face"),
        next: document.querySelector("#next-face"),
        select: document.querySelector("#face-select"),
        deviceUrl: document.querySelector("#device-url"),
        syncWifi: document.querySelector("#sync-wifi"),
        syncBle: document.querySelector("#sync-ble"),
        ssid: document.querySelector("#wifi-ssid"),
        pass: document.querySelector("#wifi-pass"),
        sendWifi: document.querySelector("#send-wifi"),
        status: document.querySelector("#device-status"),
        prompt: document.querySelector("#voice-prompt"),
        provider: document.querySelector("#voice-provider"),
        continuous: document.querySelector("#voice-continuous"),
        report: document.querySelector("#voice-report"),
        listen: document.querySelector("#voice-listen"),
        speak: document.querySelector("#voice-speak"),
        duplex: document.querySelector("#voice-duplex"),
        stopVoice: document.querySelector("#voice-stop"),
        buttonVoice: document.querySelector("#voice-button"),
        allVoice: document.querySelector("#voice-all"),
        clearVoice: document.querySelector("#voice-clear"),
        repeatVoice: document.querySelector("#voice-repeat"),
      };

      var Module = {
        locateFile(path) {
          return new URL(path, document.baseURI).href;
        },
        onRuntimeInitialized() {
          populateFaces();
          controls.prev.disabled = false;
          controls.next.disabled = false;
          controls.select.disabled = false;
        },
      };
    </script>

    {{{ SCRIPT }}}

    <script>
      const faceSelect = controls.select;
      let faceCount = 0;
      let bleSettingsCharacteristic = null;
      let lastSpokenText = "";
      let voiceRecognition = null;
      let duplexRunning = false;
      const voiceReport = [];
      const BLE_SERVICE_UUID = "01000000-5017-0065-6261-6c6f72747341";
      const BLE_SETTINGS_UUID = "03000000-5017-0065-6261-6c6f72747341";

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }

      function populateFaces() {
        faceCount = Module.ccall("astrolabe_web_face_count", "number");
        faceSelect.replaceChildren();
        for (let face = 0; face < faceCount; face++) {
          const namePtr = Module.ccall("astrolabe_web_face_name", "number", ["number"], [face]);
          const option = document.createElement("option");
          option.value = String(face);
          option.textContent = `${String(face).padStart(2, "0")} ${Module.UTF8ToString(namePtr)}`;
          faceSelect.append(option);
        }
        faceSelect.value = String(faceCount - 1);
      }

      function setFace(face) {
        if (!Module.ccall || faceCount <= 0) {
          return;
        }
        const normalized = ((face % faceCount) + faceCount) % faceCount;
        faceSelect.value = String(normalized);
        Module.ccall("astrolabe_web_set_face", null, ["number"], [normalized]);
      }

      function currentFaceMeta() {
        const face = Number(faceSelect.value || "0");
        const namePtr = Module.ccall("astrolabe_web_face_name", "number", ["number"], [face]);
        const slugPtr = Module.ccall("astrolabe_web_face_slug", "number", ["number"], [face]);
        return {
          id: face,
          name: Module.UTF8ToString(namePtr),
          slug: Module.UTF8ToString(slugPtr),
        };
      }

      function setVoiceState(state, detail, durationMs = 1800) {
        if (!Module.ccall) {
          return;
        }
        Module.ccall("astrolabe_web_voice_state", null, ["string", "string", "number"], [state, detail, durationMs]);
      }

      faceSelect.addEventListener("change", () => setFace(Number(faceSelect.value)));
      controls.prev.addEventListener("click", () => setFace(Number(faceSelect.value) - 1));
      controls.next.addEventListener("click", () => setFace(Number(faceSelect.value) + 1));

      const canvas = document.querySelector("#astrolabe-canvas");
      let swipeStart = null;

      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) {
          return;
        }
        swipeStart = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          time: performance.now(),
        };
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointerup", (event) => {
        if (!swipeStart || swipeStart.id !== event.pointerId) {
          return;
        }
        const dx = event.clientX - swipeStart.x;
        const dy = event.clientY - swipeStart.y;
        const dt = performance.now() - swipeStart.time;
        swipeStart = null;
        if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4 || dt > 900) {
          return;
        }
        setFace(Number(faceSelect.value) + (dx < 0 ? 1 : -1));
      });

      canvas.addEventListener("pointercancel", () => {
        swipeStart = null;
      });

      function setStatus(text) {
        controls.status.textContent = text;
      }

      function appendVoiceReport(event, detail = "") {
        const line = `${new Date().toLocaleTimeString()} ${event}${detail ? ` ${detail}` : ""}`;
        voiceReport.push(line);
        while (voiceReport.length > 18) {
          voiceReport.shift();
        }
        controls.report.textContent = voiceReport.join("\n");
        controls.report.scrollTop = controls.report.scrollHeight;
        window.astrolabeVoiceTestReport = voiceReport.slice();
      }

      function speechRecognitionCtor() {
        return window.SpeechRecognition || window.webkitSpeechRecognition || null;
      }

      function stopVoice() {
        duplexRunning = false;
        if (voiceRecognition) {
          voiceRecognition.stop();
          voiceRecognition = null;
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        setVoiceState("listen", "voice stopped", 900);
        setStatus("Voice stopped");
        appendVoiceReport("stop");
      }

      function listenOnce({ continuous = false } = {}) {
        if (controls.provider.value === "manual") {
          const text = controls.prompt.value.trim();
          setVoiceState("think", text ? "manual transcript" : "empty transcript", 900);
          appendVoiceReport("stt.manual", JSON.stringify(text));
          return Promise.resolve(text);
        }
        const Recognition = speechRecognitionCtor();
        if (!Recognition) {
          setVoiceState("listen", "STT unavailable", 1600);
          setStatus("Browser STT is unavailable here; edit the prompt text manually");
          appendVoiceReport("stt.unavailable");
          return Promise.resolve(controls.prompt.value.trim());
        }
        if (voiceRecognition) {
          voiceRecognition.stop();
        }
        return new Promise((resolve, reject) => {
          const rec = new Recognition();
          voiceRecognition = rec;
          rec.lang = navigator.language || "en-US";
          rec.continuous = continuous;
          rec.interimResults = true;
          let finalText = "";
          rec.onstart = () => {
            setVoiceState("listen", continuous ? "continuous listening" : "listening", 12000);
            setStatus("Listening...");
            appendVoiceReport("stt.start", rec.lang);
          };
          rec.onresult = (event) => {
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const text = event.results[i][0].transcript.trim();
              if (event.results[i].isFinal) {
                finalText += `${finalText ? " " : ""}${text}`;
              } else {
                interim = text;
              }
            }
            controls.prompt.value = finalText || interim || controls.prompt.value;
          };
          rec.onerror = (event) => {
            voiceRecognition = null;
            setVoiceState("listen", "STT error", 1600);
            appendVoiceReport("stt.error", event.error || "speech recognition failed");
            reject(new Error(event.error || "speech recognition failed"));
          };
          rec.onend = () => {
            voiceRecognition = null;
            const text = (finalText || controls.prompt.value).trim();
            setVoiceState("think", text ? "transcript ready" : "no speech", 1400);
            appendVoiceReport("stt.end", JSON.stringify(text));
            resolve(text);
          };
          rec.start();
        });
      }

      function speechTextForFace(face, promptText) {
        const prompt = promptText || controls.prompt.value.trim() || "Voice test.";
        return `${face.name}. ${prompt}`;
      }

      function speakText(text, detail = "speaking") {
        lastSpokenText = text;
        if (typeof window.astrolabeWebsimVoiceSink === "function") {
          const startMs = performance.now();
          setVoiceState("speak", detail, 12000);
          setStatus(detail);
          appendVoiceReport("tts.start", `${detail} chars=${text.length}`);
          return Promise.resolve()
            .then(() => window.astrolabeWebsimVoiceSink(text, detail))
            .then(() => {
              setVoiceState("listen", "TTS done", 1200);
              setStatus("TTS done");
              appendVoiceReport("tts.end", `ms=${Math.round(performance.now() - startMs)}`);
              return true;
            })
            .catch((err) => {
              setVoiceState("speak", "TTS error", 1600);
              setStatus("TTS error");
              appendVoiceReport("tts.error", err && err.message ? err.message : "voice sink failed");
              return false;
            });
        }
        if (!("speechSynthesis" in window)) {
          setVoiceState("speak", "TTS unavailable", 1600);
          setStatus("Browser TTS is unavailable in this environment");
          appendVoiceReport("tts.unavailable");
          return Promise.resolve(false);
        }
        return new Promise((resolve) => {
          window.speechSynthesis.cancel();
          const startMs = performance.now();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = navigator.language || "en-US";
          utterance.rate = 0.95;
          utterance.pitch = 1.0;
          utterance.onstart = () => {
            setVoiceState("speak", detail, 12000);
            setStatus(detail);
            appendVoiceReport("tts.start", `${detail} chars=${text.length}`);
          };
          utterance.onend = () => {
            setVoiceState("listen", "TTS done", 1200);
            setStatus("TTS done");
            appendVoiceReport("tts.end", `ms=${Math.round(performance.now() - startMs)}`);
            resolve(true);
          };
          utterance.onerror = (event) => {
            setVoiceState("speak", "TTS error", 1600);
            setStatus("TTS error");
            appendVoiceReport("tts.error", event.error || "speech synthesis failed");
            resolve(false);
          };
          window.speechSynthesis.speak(utterance);
        });
      }

      async function speakCurrentFace(reason = "face TTS") {
        const face = currentFaceMeta();
        const text = speechTextForFace(face, controls.prompt.value.trim());
        return speakText(text, `${reason}: ${face.slug || face.name}`);
      }

      async function runDuplexOnce() {
        try {
          const transcript = await listenOnce({ continuous: controls.continuous.checked });
          setVoiceState("think", "preparing reply", 1200);
          await speakText(speechTextForFace(currentFaceMeta(), transcript), "duplex reply");
        } catch (err) {
          setStatus(err.message);
          appendVoiceReport("duplex.error", err.message);
        }
      }

      async function runDuplexLoop() {
        if (duplexRunning) {
          stopVoice();
          return;
        }
        duplexRunning = true;
        controls.duplex.textContent = "Stop Loop";
        appendVoiceReport("duplex.start");
        try {
          do {
            await runDuplexOnce();
            if (!controls.continuous.checked) {
              break;
            }
            await new Promise((resolve) => setTimeout(resolve, 250));
          } while (duplexRunning);
        } finally {
          duplexRunning = false;
          controls.duplex.textContent = "Duplex";
          appendVoiceReport("duplex.end");
        }
      }

      async function testAllFaces() {
        controls.allVoice.disabled = true;
        appendVoiceReport("tour.start", `faces=${faceCount}`);
        try {
          let passed = 0;
          for (let face = 0; face < faceCount; face++) {
            setFace(face);
            Module.ccall("astrolabe_web_button_press", null);
            const meta = currentFaceMeta();
            const ok = await speakText(speechTextForFace(meta, "button press TTS test."), `button TTS: ${meta.slug}`);
            appendVoiceReport(ok ? "tour.pass" : "tour.fail", meta.slug || meta.name);
            if (!ok) {
              break;
            }
            passed++;
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          appendVoiceReport("tour.done", `${passed}/${faceCount}`);
        } finally {
          controls.allVoice.disabled = false;
        }
      }

      controls.listen.addEventListener("click", () => {
        listenOnce({ continuous: controls.continuous.checked }).then((text) => {
          if (text) setStatus(`Transcript: ${text}`);
        }).catch((err) => setStatus(err.message));
      });
      controls.speak.addEventListener("click", () => {
        speakCurrentFace("face TTS");
      });
      controls.duplex.addEventListener("click", runDuplexLoop);
      controls.stopVoice.addEventListener("click", stopVoice);
      controls.buttonVoice.addEventListener("click", () => {
        Module.ccall("astrolabe_web_button_press", null);
        speakCurrentFace("button TTS");
      });
      controls.allVoice.addEventListener("click", testAllFaces);
      controls.clearVoice.addEventListener("click", () => {
        controls.prompt.value = "";
        voiceReport.length = 0;
        controls.report.textContent = "";
        setStatus("Prompt cleared");
      });
      controls.repeatVoice.addEventListener("click", () => {
        if (lastSpokenText) {
          speakText(lastSpokenText, "repeat TTS");
        } else {
          speakCurrentFace("repeat TTS");
        }
      });

      function fixedPosixTimezone(date = new Date()) {
        const offsetMinutes = date.getTimezoneOffset();
        if (offsetMinutes === 0) {
          return "UTC0";
        }
        const hours = Math.trunc(Math.abs(offsetMinutes) / 60);
        const minutes = Math.abs(offsetMinutes) % 60;
        const sign = offsetMinutes > 0 ? "" : "-";
        return `UTC${sign}${hours}${minutes ? `:${String(minutes).padStart(2, "0")}` : ""}`;
      }

      function currentPosition() {
        if (!navigator.geolocation) {
          return Promise.resolve(null);
        }
        return new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({
              lat: Number(pos.coords.latitude.toFixed(6)),
              lon: Number(pos.coords.longitude.toFixed(6)),
              source: "pwa-geolocation",
            }),
            () => resolve(null),
            { enableHighAccuracy: false, timeout: 9000, maximumAge: 3600000 },
          );
        });
      }

      async function settingsPayload(includeWifi = false) {
        const location = await currentPosition();
        const payload = {
          tz: fixedPosixTimezone(),
          tz_name: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
          epoch: Math.floor(Date.now() / 1000),
        };
        if (location) {
          payload.location = location;
        }
        if (includeWifi) {
          payload.wifi = {
            ssid: controls.ssid.value.trim(),
            password: controls.pass.value,
          };
        }
        return payload;
      }

      function normalizedDeviceUrl() {
        const raw = controls.deviceUrl.value.trim() || window.localStorage.getItem("astrolabeDeviceUrl") || "";
        if (!raw) {
          if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            throw new Error("Enter the watch URL first, or use BLE");
          }
          return window.location.origin;
        }
        return raw.startsWith("http://") || raw.startsWith("https://") ? raw.replace(/\/$/, "") : `http://${raw}`;
      }

      async function postSettingsOverWifi(includeWifi = false) {
        const base = normalizedDeviceUrl();
        window.localStorage.setItem("astrolabeDeviceUrl", base);
        const payload = await settingsPayload(includeWifi);
        const res = await fetch(`${base}/api/settings`, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload),
        });
        const json = await res.json();
        setStatus(json.ok ? `Synced ${json.time?.tz || payload.tz}` : `Sync failed: ${json.err}`);
      }

      async function connectBle() {
        if (!navigator.bluetooth) {
          throw new Error("Web Bluetooth is not available in this browser");
        }
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [BLE_SERVICE_UUID] }],
          optionalServices: [BLE_SERVICE_UUID],
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(BLE_SERVICE_UUID);
        bleSettingsCharacteristic = await service.getCharacteristic(BLE_SETTINGS_UUID);
        return device;
      }

      async function writeBleSettings(includeWifi = false) {
        if (!bleSettingsCharacteristic) {
          await connectBle();
        }
        const bytes = new TextEncoder().encode(JSON.stringify(await settingsPayload(includeWifi)));
        await bleSettingsCharacteristic.writeValueWithResponse(new TextEncoder().encode("BEGIN"));
        for (let i = 0; i < bytes.length; i += 18) {
          await bleSettingsCharacteristic.writeValueWithResponse(bytes.slice(i, i + 18));
        }
        await bleSettingsCharacteristic.writeValueWithResponse(new TextEncoder().encode("END"));
        setStatus("Synced over BLE");
      }

      controls.syncWifi.addEventListener("click", () => {
        setStatus("Syncing location and timezone over Wi-Fi...");
        postSettingsOverWifi(false).catch((err) => setStatus(err.message));
      });
      controls.syncBle.addEventListener("click", () => {
        setStatus("Syncing location and timezone over BLE...");
        writeBleSettings(false).catch((err) => setStatus(err.message));
      });
      controls.sendWifi.addEventListener("click", () => {
        if (!controls.ssid.value.trim()) {
          setStatus("Enter an SSID first");
          return;
        }
        setStatus("Sending Wi-Fi credentials...");
        const hasDeviceUrl = Boolean(controls.deviceUrl.value.trim() || window.localStorage.getItem("astrolabeDeviceUrl"));
        const viaBle = Boolean(bleSettingsCharacteristic) || (!hasDeviceUrl && navigator.bluetooth);
        (viaBle ? writeBleSettings(true) : postSettingsOverWifi(true)).catch((err) => setStatus(err.message));
      });
    </script>
  </body>
</html>
