<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astrolabe LVGL Web Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111418;
        color: #eef3f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #202833 0, #111418 58%, #090b0f 100%);
      }

      main {
        width: min(100vw, 760px);
        padding: 24px;
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .watch {
        width: min(466px, calc(100vw - 32px));
        aspect-ratio: 1;
        border-radius: 50%;
        background: #050608;
        box-shadow: 0 0 0 10px #1b222b, 0 24px 80px rgb(0 0 0 / 55%);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .controls {
        width: min(466px, calc(100vw - 32px));
        display: grid;
        grid-template-columns: 38px 1fr 38px;
        align-items: center;
        gap: 8px;
      }

      button,
      select {
        min-height: 38px;
        border: 1px solid #384655;
        border-radius: 7px;
        background: #1b232c;
        color: #eef3f6;
        font: inherit;
        cursor: pointer;
      }

      select {
        width: 100%;
        padding: 0 10px;
      }

      button {
        display: grid;
        place-items: center;
        padding: 0;
      }

      button:hover,
      select:hover {
        background: #24303b;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="watch">
        <canvas id="astrolabe-canvas" width="466" height="466"></canvas>
      </div>
      <div class="controls" aria-label="Watch face controls">
        <button type="button" id="prev-face" aria-label="Previous face">‹</button>
        <select id="face-select" aria-label="Face">
          <option value="0">00 Classic</option>
          <option value="1">01 Apocalypso</option>
          <option value="2">02 Digital</option>
          <option value="3">03 Spotify</option>
          <option value="4">04 Astrology</option>
          <option value="5">05 Moon</option>
          <option value="6">06 CalciferCountdown</option>
          <option value="7">07 Castalia</option>
          <option value="8">08 Settings</option>
          <option value="9">09 Synastry</option>
          <option value="10">10 Spectrum</option>
          <option value="11">11 Chakra</option>
          <option value="12">12 TibetanBowl</option>
          <option value="13">13 Rocket</option>
          <option value="14">14 Radar</option>
          <option value="15">15 Faculty</option>
          <option value="16">16 Weather</option>
          <option value="17">17 Quotes</option>
          <option value="18">18 LiveTransits</option>
          <option value="19">19 Tarot</option>
          <option value="20">20 Notes</option>
          <option value="21">21 Ocarina</option>
          <option value="22">22 Bongo</option>
          <option value="23">23 Piano</option>
          <option value="24">24 Level</option>
          <option value="25">25 Tuning</option>
          <option value="26">26 PanDrum</option>
          <option value="27">27 Alethiometer</option>
          <option value="28">28 Runes</option>
        </select>
        <button type="button" id="next-face" aria-label="Next face">›</button>
      </div>
    </main>

    {{{ SCRIPT }}}

    <script>
      const faceSelect = document.querySelector("#face-select");
      const faceCount = faceSelect.options.length;

      function setFace(face) {
        const normalized = ((face % faceCount) + faceCount) % faceCount;
        faceSelect.value = String(normalized);
        Module.ccall("astrolabe_web_set_face", null, ["number"], [normalized]);
      }

      faceSelect.addEventListener("change", () => setFace(Number(faceSelect.value)));
      document.querySelector("#prev-face").addEventListener("click", () => setFace(Number(faceSelect.value) - 1));
      document.querySelector("#next-face").addEventListener("click", () => setFace(Number(faceSelect.value) + 1));
    </script>
  </body>
</html>
