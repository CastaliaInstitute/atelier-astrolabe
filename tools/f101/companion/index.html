<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrolabe · Face sync</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#eef2fa;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(92vw,520px);text-align:center;padding:24px}header{letter-spacing:.22em;font-size:12px;color:#95b6da}#dial{aspect-ratio:1;border-radius:50%;border:1px solid #48607b;background:radial-gradient(circle,#203149,#101a29 68%);display:flex;flex-direction:column;justify-content:center;margin:28px 0;touch-action:pan-y;box-shadow:0 0 60px #132742}h1{font-size:32px;margin:10px}#clock{font-size:38px;font-variant-numeric:tabular-nums}p{color:#a8bbd1;line-height:1.5}button,select{background:#1c2c41;color:inherit;border:1px solid #405777;border-radius:12px;padding:14px;font:inherit}nav{display:flex;gap:12px;justify-content:center}button:disabled{opacity:.35}select{width:100%;margin:18px 0}#status{min-height:48px;font-size:14px}small{color:#9eafc5}
</style><main><header>ASTROLABE / F101</header><section id="dial" aria-label="Swipe left or right to select a face"><small>SELECTED FACE</small><h1 id="face">Connecting…</h1><div id="clock"></div></section><nav><button id="prev" aria-label="Previous face">←</button><button id="next" aria-label="Next face">→</button></nav><select id="choices" aria-label="Choose face"></select><p id="status" role="status">Connecting to Astrolabe…</p><small>Swipe either device to change the shared face.<br>This companion shows face selection, not a live screen image.</small></main>
<script>
const token='__TOKEN__';let state=null,busy=false,start=null;const $=id=>document.getElementById(id), label=s=>s.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
function render(s){state=s;const locked=!s.connected||s.pending!==null||busy;for(const id of ['prev','next','choices'])$(id).disabled=locked;$('face').textContent=s.face?label(s.face):'Connecting…';const names=[...s.faces];if(s.face&&!names.includes(s.face))names.unshift(s.face);$('choices').replaceChildren(...names.map(f=>{const o=document.createElement('option');o.value=f;o.textContent=label(f);o.selected=f===s.face;return o}));$('status').textContent=s.error?'Disconnected · '+s.error:s.pending?'Switching to '+label(s.pending)+'…':s.connected?'Synced with Astrolabe':'Connecting to Astrolabe…';$('clock').hidden=s.face!=='pocketwatch'}
async function poll(){try{const r=await fetch('/state');if(!r.ok)throw Error('Companion unavailable');render(await r.json())}catch(e){$('status').textContent='Connection unavailable';if(state)render({...state,connected:false,error:e.message})}setTimeout(poll,750)}
async function select(face){if(!state||!state.connected||state.pending||busy)return;busy=true;render(state);try{const r=await fetch('/face',{method:'POST',headers:{'Content-Type':'application/json','X-Sync-Token':token},body:JSON.stringify({face})});const s=await r.json();if(!r.ok)throw Error(s.error);state=s}catch(e){$('status').textContent=e.message}finally{busy=false;render(state)}}
function step(n){if(!state)return;const i=state.faces.indexOf(state.face);select(state.faces[(Math.max(i,0)+n+state.faces.length)%state.faces.length])}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('choices').onchange=e=>select(e.target.value);$('dial').onpointerdown=e=>{start={x:e.clientX,y:e.clientY};$('dial').setPointerCapture(e.pointerId)};$('dial').onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)};$('dial').onpointercancel=()=>start=null;document.onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)};setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);poll();
</script></html>
