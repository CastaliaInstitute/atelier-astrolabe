# Publish static site from docs/. Repo Settings → Pages → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [integration, main]
    paths:
      - "config/release_variants.csv"
      - "docs/**"
      - "platformio.ini"
      - "scripts/build.sh"
      - "scripts/astrolabe175c_build.sh"
      - "scripts/publish-integration-firmware.py"
      - "scripts/release-size-report.py"
      - "scripts/sign-astrolabe175c-ota-manifest.py"
      - "astrolabe175c/**"
      - "lib/astrolabe_audio_pipeline/**"
      - "lib/astrolabe_display_core/**"
      - "lib/astrolabe_time/**"
      - "lib/PNGdec/**"
      - "lib/XPowersLib/**"
      - "sketches/Astrolabe/**"
      - "tools/web-sim/**"
      - "ui/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache PlatformIO
        if: (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main') && !contains(github.event.head_commit.message || '', '[pages-only]')
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/build.sh') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO
        if: (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main') && !contains(github.event.head_commit.message || '', '[pages-only]')
        run: pip install platformio
      - name: Publish integration firmware
        if: (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main') && !contains(github.event.head_commit.message || '', '[pages-only]')
        env:
          PLATFORMIO_BUILD_DIR: /tmp/astrolabe-pio-build-${{ github.run_id }}
          ASTROLABE_RELEASE_ARTIFACT_DIR: /tmp/astrolabe-release-artifacts-${{ github.run_id }}
        run: |
          ./scripts/release-size-report.py --build --build-dir "$PLATFORMIO_BUILD_DIR" --artifact-dir "$ASTROLABE_RELEASE_ARTIFACT_DIR"
          python3 ./scripts/publish-integration-firmware.py --build-dir "$ASTROLABE_RELEASE_ARTIFACT_DIR"
      - name: Publish astrolabe175c ESP-IDF OTA
        if: (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main') && !contains(github.event.head_commit.message || '', '[pages-only]')
        env:
          ASTROLABE175C_SKIP_LVGL_AUDIT: "1"
          FACULTY175_OTA_PRIVATE_KEY_PEM: ${{ secrets.FACULTY175_OTA_PRIVATE_KEY_PEM }}
          FACULTY175_OTA_DEVICES: ${{ vars.FACULTY175_OTA_DEVICES || 'a0:f2:62:e3:06:44,44:1b:f6:85:52:74' }}
        run: |
          test -n "$FACULTY175_OTA_PRIVATE_KEY_PEM"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            espressif/idf:v5.5.1 \
            bash -lc './scripts/astrolabe175c_build.sh build'
          channel="astrolabe-faculty-amoled175"
          out="docs/releases/integration/${channel}"
          mkdir -p "$out"
          cp astrolabe175c/build/astrolabe175c.bin "$out/firmware.bin"
          key="$(mktemp)"
          devices="$(mktemp)"
          printf '%s\n' "$FACULTY175_OTA_PRIVATE_KEY_PEM" > "$key"
          printf '%s\n' "$FACULTY175_OTA_DEVICES" | tr ', ' '\n\n' | sed '/^$/d' > "$devices"
          python3 ./scripts/sign-astrolabe175c-ota-manifest.py \
            --image "$out/firmware.bin" \
            --firmware-url "https://astrolabe.castalia.institute/releases/integration/${channel}/firmware.bin" \
            --private-key "$key" \
            --devices-file "$devices" \
            --out "$out/ota-manifest.json"
          rm -f "$key" "$devices"
      - name: Build LVGL web simulator
        if: "!contains(github.event.head_commit.message || '', '[pages-only]')"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            emscripten/emsdk:3.1.74 \
            ./tools/web-sim/export-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
