# Publish static site from docs/. Repo Settings → Pages → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [integration, main]
    paths:
      - "config/release_variants.csv"
      - "docs/**"
      - "platformio.ini"
      - "scripts/build.sh"
      - "scripts/publish-integration-firmware.py"
      - "scripts/release-size-report.py"
      - "sketches/Astrolabe/**"
      - "tools/web-sim/**"
      - "ui/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache PlatformIO
        if: github.ref == 'refs/heads/integration'
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/build.sh') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO
        if: github.ref == 'refs/heads/integration'
        run: pip install platformio
      - name: Publish integration firmware
        if: github.ref == 'refs/heads/integration'
        env:
          PLATFORMIO_BUILD_DIR: /tmp/astrolabe-pio-build-${{ github.run_id }}
        run: |
          ./scripts/release-size-report.py --build --build-dir "$PLATFORMIO_BUILD_DIR"
          python3 ./scripts/publish-integration-firmware.py --build-dir "$PLATFORMIO_BUILD_DIR"
      - name: Build LVGL web simulator
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            emscripten/emsdk:3.1.74 \
            ./tools/web-sim/export-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
