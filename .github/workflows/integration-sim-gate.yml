# QEMU serial sim gate — informational (runs after Firmware build; not a merge blocker).
# Hardware device gate remains for promotion to main (self-hosted m1).
#
# Branch protection on integration: required check = Firmware build only.
# Optional: repo variable ENABLE_INTEGRATION_SIM_GATE=false skips post-merge sim on integration pushes.
#
name: Integration sim gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: integration
  workflow_run:
    workflows: [Firmware build]
    types: [completed]
    branches: [integration]

concurrency:
  group: astrolabe-qemu-sim-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  sim-gate:
    name: QEMU sim test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          vars.ENABLE_INTEGRATION_SIM_GATE != 'false'
        )
      )
    env:
      PLATFORMIO_BUILD_DIR: /tmp/astrolabe-pio-qemu-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.ref
            || github.event.workflow_run.head_sha }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/build.sh') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Cache Espressif QEMU
        uses: actions/cache@v4
        with:
          path: ~/.espressif/tools/qemu-xtensa
          key: qemu-xtensa-${{ runner.os }}-esp_develop_9.2.2_20250817

      - name: Download QEMU firmware bins
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: firmware-waveshare_s3_175_qemu
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ env.PLATFORMIO_BUILD_DIR }}/waveshare_s3_175_qemu

      - name: Install tools
        run: |
          pip install platformio pyserial
          sudo apt-get update -qq
          sudo apt-get install -y libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0

      - name: QEMU sim functional test
        env:
          SKIP_BUILD: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
          CI_SIM_FAST: "1"
        run: bash ./scripts/ci-qemu-sim.sh

      - name: Upload sim report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-gate-${{ github.run_id }}
          path: artifacts/functional-sim/
          retention-days: 14
          if-no-files-found: ignore
