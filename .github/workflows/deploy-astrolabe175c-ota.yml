name: Deploy Astrolabe175C OTA

on:
  push:
    branches: [integration, main]
    paths:
      - ".github/workflows/deploy-astrolabe175c-ota.yml"
      - "astrolabe175c/**"
      - "lib/astrolabe_audio_pipeline/**"
      - "lib/astrolabe_display_core/**"
      - "lib/astrolabe_time/**"
      - "lib/PNGdec/**"
      - "lib/XPowersLib/**"
      - "scripts/astrolabe175c_build.sh"
      - "scripts/sign-astrolabe175c-ota-manifest.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astrolabe175c-ota-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build astrolabe175c ESP-IDF OTA
        env:
          ASTROLABE175C_SKIP_LVGL_AUDIT: "1"
          FACULTY175_OTA_PRIVATE_KEY_PEM: ${{ secrets.FACULTY175_OTA_PRIVATE_KEY_PEM }}
          FACULTY175_OTA_DEVICES: ${{ vars.FACULTY175_OTA_DEVICES || 'a0:f2:62:e3:06:44,44:1b:f6:85:52:74,a4:cb:8f:d6:41:94' }}
        run: |
          test -n "$FACULTY175_OTA_PRIVATE_KEY_PEM"
          key="$(mktemp)"
          devices="$(mktemp)"
          printf '%s\n' "$FACULTY175_OTA_PRIVATE_KEY_PEM" > "$key"
          printf '%s\n' "$FACULTY175_OTA_DEVICES" | tr ', ' '\n\n' | sed '/^$/d' > "$devices"
          for spec in \
            "faculty|Faculty|astrolabe-faculty-amoled175" \
            "cyber|Cyber|astrolabe-cyber-175" \
            "lunasay|LunaSay|astrolabe-lunasay-175"; do
            IFS='|' read -r variant label channel <<< "$spec"
            # Docker writes the prior variant's build as root on the runner.
            sudo rm -rf astrolabe175c/build
            docker run --rm \
              -e ASTROLABE175C_SKIP_LVGL_AUDIT=1 \
              -e "ASTROLABE175C_VARIANT=${variant}" \
              -v "$GITHUB_WORKSPACE:/project" \
              -w /project \
              espressif/idf:v5.5.1 \
              bash -lc 'git config --global --add safe.directory /project && ./scripts/astrolabe175c_build.sh build'
            out="docs/releases/integration/${channel}"
            mkdir -p "$out"
            cp astrolabe175c/build/astrolabe175c.bin "$out/firmware.bin"
            python3 ./scripts/sign-astrolabe175c-ota-manifest.py \
              --image "$out/firmware.bin" \
              --channel "$channel" \
              --firmware-variant "$label" \
              --firmware-url "https://astrolabe.castalia.institute/releases/integration/${channel}/firmware.bin" \
              --private-key "$key" \
              --devices-file "$devices" \
              --out "$out/ota-manifest.json"
          done
          rm -f "$key" "$devices"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
