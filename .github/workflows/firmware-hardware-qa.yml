# Self-hosted: debug flash → JTAG face → screen.bmp → comment on GitHub issue.
#
# Runner labels: self-hosted, astrolabe-watch (this laptop).
# Laptop must have include/secrets.local.h at ASTROLABE_SECRETS_FILE or repo path.
#
name: Firmware hardware QA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: integration
      face:
        description: Clock face (moon, astro, classic, …)
        required: false
        default: moon
      issue_number:
        description: GitHub issue to attach screenshot (required)
        required: true
        type: string
  workflow_run:
    workflows: [Firmware build]
    types: [completed]
    branches: [integration]

concurrency:
  group: hardware-qa-${{ github.event.inputs.issue_number || 'auto' }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  hardware-qa:
    name: JTAG + screenshot → issue
    runs-on: [self-hosted, astrolabe-watch]
    environment: astrolabe-watch
    env:
      PLATFORMIO_BUILD_DIR: /tmp/astrolabe-pio-build-${{ github.run_id }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        vars.ENABLE_INTEGRATION_HW_QA == 'true' &&
        vars.ASTROLABE_QA_ISSUE != ''
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-hwqa-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/build.sh') }}
          restore-keys: |
            pio-hwqa-${{ runner.os }}-

      - name: Install tools
        run: |
          pip install platformio
          command -v gh >/dev/null || brew install gh
          command -v curl >/dev/null

      - name: Device secrets
        env:
          MYNAH_WIFI_SSID: ${{ secrets.MYNAH_WIFI_SSID }}
          MYNAH_WIFI_PASSWORD: ${{ secrets.MYNAH_WIFI_PASSWORD }}
          MYNAH_SUPABASE_URL: ${{ secrets.MYNAH_SUPABASE_URL }}
          MYNAH_SUPABASE_ANON_KEY: ${{ secrets.MYNAH_SUPABASE_ANON_KEY }}
        run: |
          if [[ -f "${ASTROLABE_SECRETS_FILE:-$HOME/GitHub/CastaliaInstitute/astrolabe/include/secrets.local.h}" ]]; then
            cp "${ASTROLABE_SECRETS_FILE:-$HOME/GitHub/CastaliaInstitute/astrolabe/include/secrets.local.h}" include/secrets.local.h
          elif [[ -n "${MYNAH_WIFI_SSID:-}" ]]; then
            ./scripts/write_secrets_ci.sh
          else
            echo "No secrets — add laptop secrets.local.h or GitHub Actions secrets"
            exit 1
          fi

      - name: Hardware QA (JTAG debug + screen.bmp → issue)
        env:
          ASTROLABE_QA_FACE: ${{ github.event_name == 'workflow_dispatch' && inputs.face || vars.ASTROLABE_QA_FACE || 'moon' }}
          ASTROLABE_QA_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || vars.ASTROLABE_QA_ISSUE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci-hardware-qa.sh --issue "$ASTROLABE_QA_ISSUE" --face "$ASTROLABE_QA_FACE"

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-qa-${{ github.run_id }}
          path: artifacts/qa/
          retention-days: 14
          if-no-files-found: ignore
