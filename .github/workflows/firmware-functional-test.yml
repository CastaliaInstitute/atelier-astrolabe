# Self-hosted: flash → every clock face → screenshot + injected touch/button → crash check.
#
# Runner labels: self-hosted, astrolabe-watch
# Prefer integration-device-gate.yml. Standalone dispatch only (no workflow_run auto).
# Requires Wi‑Fi secrets on the runner host.
#
name: Firmware functional test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: integration
      faces:
        description: Comma-separated face names (empty = all)
        required: false
        default: ""
concurrency:
  group: astrolabe-watch-device
  cancel-in-progress: false

jobs:
  functional-test:
    name: Face matrix QA
    runs-on: [self-hosted, astrolabe-watch]
    environment: astrolabe-watch
    env:
      PLATFORMIO_BUILD_DIR: /tmp/astrolabe-pio-build-${{ github.run_id }}
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-ft-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/build.sh') }}
          restore-keys: |
            pio-ft-${{ runner.os }}-

      - name: Install tools
        run: bash ./scripts/ci-install-tools.sh

      - name: Device secrets
        env:
          MYNAH_WIFI_SSID: ${{ secrets.MYNAH_WIFI_SSID }}
          MYNAH_WIFI_PASSWORD: ${{ secrets.MYNAH_WIFI_PASSWORD }}
          MYNAH_SUPABASE_URL: ${{ secrets.MYNAH_SUPABASE_URL }}
          MYNAH_SUPABASE_ANON_KEY: ${{ secrets.MYNAH_SUPABASE_ANON_KEY }}
        run: ./scripts/ensure-device-secrets.sh

      - name: Functional test (all faces)
        id: ft
        env:
          ASTROLABE_FT_FACES: ${{ github.event_name == 'workflow_dispatch' && inputs.faces || '' }}
          ASTROLABE_FT_UNMERGE_PUSH: ${{ vars.ASTROLABE_FT_UNMERGE_PUSH || '0' }}
          ASTROLABE_FT_DISPATCH_AGENT: ${{ vars.ASTROLABE_FT_DISPATCH_AGENT || '0' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: ./scripts/ci-functional-test.sh
        continue-on-error: true

      - name: Remediate failures (triage + issue + revert PR)
        if: steps.ft.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ASTROLABE_FT_UNMERGE_PUSH: ${{ vars.ASTROLABE_FT_UNMERGE_PUSH || '0' }}
          ASTROLABE_FT_DISPATCH_AGENT: ${{ vars.ASTROLABE_FT_DISPATCH_AGENT || '0' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          REPORT="artifacts/functional/latest/report.json"
          if [[ -f "$REPORT" ]]; then
            ./scripts/functional_remediate.sh "$REPORT"
          fi
          exit 1

      - name: Upload functional test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-${{ github.run_id }}
          path: artifacts/functional/
          retention-days: 14
          if-no-files-found: ignore
