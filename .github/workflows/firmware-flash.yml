# Flash to a physical watch via a self-hosted runner (USB). GitHub-hosted runners cannot upload.
#
# Setup: register a self-hosted runner on the Mac with the watch plugged in, labels:
#   self-hosted, astrolabe-watch
# Prefer integration-device-gate.yml (ENABLE_INTEGRATION_DEVICE_GATE). Legacy: ENABLE_INTEGRATION_FLASH.
#
name: Firmware flash

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and flash (branch or SHA)
        required: false
        default: integration
      upload_only:
        description: Skip rebuild if firmware.bin already present on runner
        type: boolean
        default: false
  workflow_run:
    workflows: [Firmware build]
    types: [completed]
    branches: [integration]

concurrency:
  group: astrolabe-watch-device
  cancel-in-progress: false

jobs:
  flash:
    name: Flash watch
    # Requires a machine with the Waveshare ESP32-S3 watch on USB (303A:1001).
    runs-on: [self-hosted, astrolabe-watch]
    environment: astrolabe-watch
    env:
      # Avoid parallel jobs clobbering the same /tmp build tree on one runner.
      PLATFORMIO_BUILD_DIR: /tmp/astrolabe-pio-build-${{ github.run_id }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        vars.ENABLE_INTEGRATION_FLASH == 'true' &&
        vars.ENABLE_INTEGRATION_DEVICE_GATE != 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Preflight (USB watch)
        run: ./scripts/preflight-watch.sh

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-flash-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/build.sh') }}
          restore-keys: |
            pio-flash-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Device secrets
        env:
          MYNAH_WIFI_SSID: ${{ secrets.MYNAH_WIFI_SSID }}
          MYNAH_WIFI_PASSWORD: ${{ secrets.MYNAH_WIFI_PASSWORD }}
          MYNAH_SUPABASE_URL: ${{ secrets.MYNAH_SUPABASE_URL }}
          MYNAH_SUPABASE_ANON_KEY: ${{ secrets.MYNAH_SUPABASE_ANON_KEY }}
        run: ./scripts/ensure-device-secrets.sh

      - name: Detect upload port
        id: port
        run: |
          PORT="$(./scripts/detect_upload_port.sh)"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "Using ${PORT}"

      - name: Build and flash
        env:
          ASTROLABE_UPLOAD_PORT: ${{ steps.port.outputs.port }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.upload_only }}" == "true" ]]; then
            ./scripts/ci-flash.sh --upload-only
          else
            ./scripts/ci-flash.sh
          fi

      - name: Upload flash log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-log-${{ github.run_id }}
          path: /tmp/astrolabe-pio-build/
          retention-days: 7
          if-no-files-found: ignore
