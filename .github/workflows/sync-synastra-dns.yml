name: Sync synastra DNS (Cloudflare → GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply synastra.castalia.institute CNAME on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_GLOBAL_API_KEY: ${{ secrets.CF_API_GLOBAL_API_KEY }}
          RECORD_NAME: synastra
        run: bash scripts/cf-dns-astrolabe-github-pages.sh
