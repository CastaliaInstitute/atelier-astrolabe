build_flags =
	${env:waveshare_s3_175.build_flags}
	-DASTROLABE_DEVICE_PLATFORM=\"1.75\"
	-DASTROLABE_OTA_CHANNEL=\"astrolabe-luopan-175\"
	-DASTROLABE_DEFAULT_VARIANT_LUOPAN=1
	-DASTROLABE_FORCE_VARIANT_LUOPAN=1

[env:waveshare_s3_175_babelfish]
