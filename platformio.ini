	-DASTROLABE_FORCE_VARIANT_CAMEO=1
	-DASTROLABE_FORCE_FACULTY_HOME=1
	-DASTROLABE_DEFAULT_FACULTY_TOM_ROBBINS=1

[env:waveshare_s3_175_luopan]
