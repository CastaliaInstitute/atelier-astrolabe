build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	${env:waveshare_s3_175.build_flags}
	-DARDUINO_USB_MODE=0
	-DASTROLABE_DEVICE_PLATFORM=\"1.75\"
	-DASTROLABE_OTA_CHANNEL=\"astrolabe-ocarina-175\"
	-DASTROLABE_DEFAULT_VARIANT_OCARINA=1
	-DASTROLABE_FORCE_VARIANT_OCARINA=1
	-DASTROLABE_USB_MIDI_ENABLED=1
	-DASTROLABE_RTP_MIDI_ENABLED=1
	-DCONFIG_TINYUSB_CDC_ENABLED=1
	-DCONFIG_TINYUSB_MIDI_ENABLED=1
	-DCONFIG_TINYUSB_MIDI_RX_BUFSIZE=64
	-DCONFIG_TINYUSB_MIDI_TX_BUFSIZE=64

[env:waveshare_s3_175_hid]
