; PlatformIO — Mynah Pocketwatch (Waveshare ESP32-S3-Touch-AMOLED-1.75C class)
; Hardware reference: https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.75C
; Sketch: Mynah Astrolabe (see sketches/Astrolabe; HelloWorld remains under sketches/01_HelloWorld).

[platformio]
default_envs = waveshare_s3_175
; Symlink main -> sketches/Astrolabe.
src_dir = main
description = Mynah Pocketwatch — ESP32-S3 round AMOLED (Waveshare 1.75C)

[env:waveshare_s3_175]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
	pre:extra_script_rename_gfx.py
	pre:extra_script_filter_gfx.py
	pre:extra_script_build_info.py

; --- Serial / upload (Espressif native USB — System Information) ---
;   Manufacturer: Espressif
;   USB Vendor ID: 0x303A   USB Product ID: 0x1001   (USB JTAG/serial)
;   Serial Number: A4:CB:8F:D6:42:60
;   Location ID: 0x00133000 — on this Mac, `pio device list` shows it as /dev/cu.usbmodem13301
;   (SER=A4:CB:8F:D6:42:60, LOCATION=0-1.3.3). If your cu.* name differs, change upload_port / monitor_port.
; Windows: use COMx from Device Manager for the same VID/PID/serial instead of /dev/cu.*.
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
upload_speed = 921600
upload_flags =
	--before=default_reset
	--after=hard_reset
build_src_filter =
	+<*>
	-<pm_tinyusb_unused_stubs.c>
	-<pm_usb_uac_component.c>
	-<third_party/tinyusb/>

; --- Flash / PSRAM (16 MB layout — same as main; app @ 0x10000. Modular OTA deferred.) ---
board_build.flash_size = 16MB
board_build.psram = opi
board_build.arduino.memory_type = qio_opi

; USB serial on boot (native USB-JTAG/Serial on many S3 boards)
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DASTROLABE_UAC_DISABLED=1
	-DCONFIG_TINYUSB_AUDIO_ENABLED=0
	-DCONFIG_UAC_SPEAKER_CHANNEL_NUM=0
	-DCONFIG_UAC_MIC_CHANNEL_NUM=0
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
	-DU8G2_USE_LARGE_FONTS
	-DU8G2_FONT_SECTION\\(name\\)=
	-DU8X8_FONT_SECTION\\(name\\)=
	-Iu8g2_shim

; GFX 1.5.0 — CO5300 ctor in sketch. SensorLib: CST92xx touch. MP3 decode (minimp3) for TTS playback.
lib_deps =
	moononournation/GFX Library for Arduino@1.5.0
	lewisxhe/SensorLib@^0.4.0
	lewisxhe/XPowersLib@^0.3.3
	bitbank2/JPEGDEC@^1.8.2
	bitbank2/PNGdec@^1.1.2
	bblanchon/ArduinoJson@^7.2.0
lib_ldf_mode = deep

[env:esp32_c3_lcd_128]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts =
	pre:extra_script_rename_gfx.py
	pre:extra_script_filter_gfx.py
	pre:extra_script_build_info.py
upload_port = /dev/cu.usbmodem13401
monitor_port = /dev/cu.usbmodem13401
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
upload_speed = 921600
upload_flags =
	--before=default_reset
	--after=hard_reset
build_src_filter =
	+<*>
	-<pm_tinyusb_unused_stubs.c>
	-<pm_usb_uac_component.c>
	-<third_party/tinyusb/>
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DASTROLABE_PLATFORM_C3_128=1
	-DASTROLABE_NO_ONBOARD_AUDIO=1
	-DASTROLABE_DISPLAY_DIRECT=1
	-DASTROLABE_NO_SIDE_BUTTONS=1
	-DASTROLABE_UAC_DISABLED=1
	-DCONFIG_TINYUSB_AUDIO_ENABLED=0
	-DCONFIG_UAC_SPEAKER_CHANNEL_NUM=0
	-DCONFIG_UAC_MIC_CHANNEL_NUM=0
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=12288
	-DMYNAH_EPHEMERIS_ENABLE=0
	-DMYNAH_FACE_FETCH_MIN_HEAP=70000u
	-DMYNAH_TLS_MIN_LARGEST_INTERNAL=24000u
	-DMYNAH_BLE_MIN_START_HEAP=90000u
	-DMYNAH_BLE_MIN_START_LARGEST_INTERNAL=24000u
	-DMYNAH_RESPONSE_INTERNAL_FLOOR=70000u
	-DU8G2_USE_LARGE_FONTS
	-DU8G2_FONT_SECTION\\(name\\)=
	-DU8X8_FONT_SECTION\\(name\\)=
	-Iu8g2_shim
lib_deps =
	moononournation/GFX Library for Arduino@1.5.0
	lewisxhe/SensorLib@^0.4.0
	lewisxhe/XPowersLib@^0.3.3
	bitbank2/JPEGDEC@^1.8.2
	bitbank2/PNGdec@^1.1.2
	bblanchon/ArduinoJson@^7.2.0
lib_ldf_mode = deep

[env:waveshare_s3_145]
extends = env:waveshare_s3_175
build_flags =
	${env:waveshare_s3_175.build_flags}
	-DASTROLABE_PLATFORM_145=1
	-DASTROLABE_DEFAULT_VARIANT_CAMEO=1
	-DASTROLABE_NO_ONBOARD_AUDIO=1

