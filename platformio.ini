	-DASTROLABE_OTA_CHANNEL=\"astrolabe-astrolabe-185\"
build_flags =
	${env:waveshare_s3_185.build_flags}
	-DASTROLABE_OTA_CHANNEL=\"astrolabe-smart-speaker-185\"
	-DASTROLABE_DEFAULT_VARIANT_SMART_SPEAKER=1
	-DASTROLABE_FORCE_VARIANT_SMART_SPEAKER=1

[env:waveshare_s3_145]
extends = env:waveshare_s3_175
build_flags =
	${env:waveshare_s3_175.build_flags}
	-DASTROLABE_DEVICE_PLATFORM=\"1.45\"
	-DASTROLABE_OTA_CHANNEL=\"astrolabe-cameo-145\"
	-DASTROLABE_PLATFORM_145=1
	-DASTROLABE_DEFAULT_VARIANT_CAMEO=1
	-DASTROLABE_NO_ONBOARD_AUDIO=1

[env:waveshare_s3_145_cameo]
extends = env:waveshare_s3_145
build_flags =
	${env:waveshare_s3_145.build_flags}
	-DASTROLABE_FORCE_VARIANT_CAMEO=1

; QEMU sim gate (ubuntu): no CO5300/touch; serial face/qa tests only.
[env:waveshare_s3_175_qemu]
extends = env:waveshare_s3_175
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env:waveshare_s3_175.build_flags}
	-DASTROLABE_QEMU=1
	-DARDUINO_USB_CDC_ON_BOOT=0

; Debug: symbols, MYNAH_DEBUG_GESTURES, USB-JTAG (esp-builtin) for ci-hardware-qa / GDB face inject.
[env:waveshare_s3_175_debug]
extends = env:waveshare_s3_175
build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak setup
build_flags =
	${env:waveshare_s3_175.build_flags}
	-DMYNAH_DEBUG_GESTURES=1
build_unflags =
	${env:waveshare_s3_175.build_unflags}
	-Os

; USB Audio Class gadget parking env.
; UAC is intentionally disabled for now; this env keeps the old target name
; buildable while preserving normal USB serial/JTAG behavior.
[env:waveshare_s3_175_uac]
extends = env:waveshare_s3_175
extra_scripts =
	pre:extra_script_rename_gfx.py
	pre:extra_script_filter_gfx.py
	pre:extra_script_build_info.py
build_unflags =
	-DASTROLABE_UAC_DEFAULT_ROUTE_USB=1
	-DCONFIG_TINYUSB_AUDIO_ENABLED=1
	-DCONFIG_UAC_SPEAKER_CHANNEL_NUM=2
build_flags =
	${env:waveshare_s3_175.build_flags}
	-DASTROLABE_UAC_DISABLED=1
	-DCONFIG_TINYUSB_AUDIO_ENABLED=0
	-DCONFIG_UAC_SPEAKER_CHANNEL_NUM=0
	-DCONFIG_UAC_MIC_CHANNEL_NUM=0
	-DCONFIG_UAC_SAMPLE_RATE=48000
