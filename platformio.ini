	-DARDUINO_USB_MODE=0
	-DASTROLABE_DEVICE_PLATFORM=\"1.75\"
	-DASTROLABE_OTA_CHANNEL=\"astrolabe-hid-175\"
	-DASTROLABE_USB_HID_ENABLED=1
	-DASTROLABE_COLMI_R02_HID_ENABLED=1
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DCONFIG_TINYUSB_HID_BUFSIZE=64

[env:waveshare_s3_175_cameo]
extends = env:waveshare_s3_175
build_flags =
